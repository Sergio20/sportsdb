name: Actualizar datos y publicar la web

on:
  schedule:
    - cron: "10 4 * * *"   # 06:10 en Madrid en verano, 05:10 en invierno: termina antes del informe de las 08:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Dos colas: la actualización de datos (diaria o a mano) nunca la cancela nada; las publicaciones por cambios de código
# van aparte y la más nueva sustituye a la anterior. El 5-10-2026 una publicación atascada en cola bloqueó la
# actualización del día siguiente; ahora además la guardia (guardia.yml) desatasca y relanza.
concurrency:
  group: ${{ github.event_name == 'push' && 'sportsdb-web' || 'sportsdb-datos' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar la base de datos (rama data)
        id: db
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:deportes_db.zip > /tmp/deportes_db.zip
          else
            cp deportes_db.zip /tmp/deportes_db.zip
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
          fi
          unzip -o /tmp/deportes_db.zip -d data
          python scripts/check_db.py data/deportes.db --save /tmp/antes.json
          # avisos enviados por el vigilante de Telegram (para medir cuánto aciertan)
          if git fetch --depth=1 origin avisos; then git show FETCH_HEAD:avisos.json > data/avisos.json; fi

      - name: Actualizar datos
        if: github.event_name != 'push'
        run: |
          if ! python update_db.py; then
            echo "::warning::Alguna fuente ha fallado; se publica con los datos disponibles"
            echo "fuente=fallo" >> "$GITHUB_ENV"
          fi

      - name: Comprobar la base de datos
        run: python scripts/check_db.py data/deportes.db --compare /tmp/antes.json

      - name: Construir la web
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Guardar la base de datos (rama data, un solo commit)
        if: github.event_name != 'push' || steps.db.outputs.bootstrap == '1'
        run: |
          python scripts/check_db.py data/deportes.db --checkpoint
          tmp=$(mktemp -d)
          (cd data && zip -q -9 "$tmp/deportes_db.zip" deportes.db)
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deportes_db.zip
          git commit -q -m "Base de datos $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # Aviso por Telegram en el momento: de esta base salen los porcentajes de los avisos
      - name: Avisar por Telegram si algo ha fallado
        if: always() && github.event_name != 'push' && (failure() || env.fuente == 'fallo')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          if [ "${{ job.status }}" = "failure" ]; then
            msg="⚠️ LA ACTUALIZACIÓN DIARIA DE LA BASE HA FALLADO. La guardia la reintentará en la próxima hora. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            msg="⚠️ Actualización diaria hecha, pero alguna fuente ha fallado: puede faltar algún partido de ayer. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${msg}" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

