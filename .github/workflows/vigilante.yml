name: Vigilante de avisos (Telegram)

# Cuatro tandas encadenadas que cubren de las 09:10 a las 02:30 UTC sin huecos (un trabajo de GitHub no
# puede durar más de 6 horas). Cada tanda vigila hasta 4,4 horas y la siguiente espera a que termine.
# Si en su franja no hay partidos de Euroliga, EuroCup ni Liga Endesa, termina en un minuto.
on:
  schedule:
    - cron: "10 9 * * *"
    - cron: "30 13 * * *"
    - cron: "50 17 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "vigilar = partidos de hoy · prueba = mensaje de prueba · ensayo = repetir el ASVEL-Valencia del minuto 16"
        type: choice
        options: [vigilar, prueba, ensayo]
        default: prueba

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mensaje de prueba
        if: github.event.inputs.modo == 'prueba'
        run: python vigilante.py --prueba

      - name: Recuperar la base de datos y los avisos ya enviados
        if: github.event.inputs.modo != 'prueba'
        run: |
          mkdir -p data
          git fetch --depth=1 origin data
          git show FETCH_HEAD:deportes_db.zip > /tmp/deportes_db.zip
          unzip -o -q /tmp/deportes_db.zip -d data
          if git fetch --depth=1 origin avisos; then git show FETCH_HEAD:avisos.json > avisos.json; fi

      - name: Ensayo con un partido ya jugado
        if: github.event.inputs.modo == 'ensayo'
        run: python vigilante.py --repetir E2026 26 16

      - name: Vigilar los partidos de hoy
        if: github.event_name == 'schedule' || github.event.inputs.modo == 'vigilar'
        run: python vigilante.py --log avisos.json --horas 4.4

      - name: Guardar los avisos enviados (rama avisos, un solo commit)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.modo == 'vigilar')
        run: |
          [ -f avisos.json ] || exit 0
          tmp=$(mktemp -d)
          cp avisos.json "$tmp/"
          cd "$tmp"
          git init -q -b avisos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avisos.json
          git commit -q -m "Avisos hasta $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" avisos
