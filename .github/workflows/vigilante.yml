name: Vigilante de avisos (Telegram)

# Cadena continua: cada tanda vigila 4,4 horas (un trabajo de GitHub no puede pasar de 6) y al acabar lanza la
# siguiente, haya partidos o no. Así no se depende del programador de GitHub, que a veces retrasa horas o se salta
# tandas (el 4-10-2026 la de las 09:10 no llegó a lanzarse y los partidos de las 10:00 se quedaron sin vigilar).
# El programador queda solo de respaldo, cada hora: si la cadena se rompe, la vuelve a arrancar. Si ya hay una tanda
# en marcha, la del respaldo espera y la cancela la siguiente de la cadena (solo puede haber una esperando).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "vigilar = partidos de hoy · prueba = mensaje de prueba · ensayo = repetir el ASVEL-Valencia del minuto 16"
        type: choice
        options: [vigilar, prueba, ensayo]
        default: prueba

permissions:
  contents: write
  actions: write      # para que una tanda pueda lanzar la siguiente

concurrency:
  # Las pruebas y ensayos van en su propia cola: no esperan a la cadena de tandas ni la interrumpen
  group: ${{ (github.event.inputs.modo == 'prueba' || github.event.inputs.modo == 'ensayo') && 'vigilante-prueba' || 'vigilante' }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}   # para publicar el estado de la Liga Endesa en la rama vivo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mensaje de prueba
        if: github.event.inputs.modo == 'prueba'
        run: python vigilante.py --prueba

      - name: Recuperar la base de datos y los avisos ya enviados
        if: github.event.inputs.modo != 'prueba'
        run: |
          mkdir -p data
          git fetch --depth=1 origin data
          git show FETCH_HEAD:deportes_db.zip > /tmp/deportes_db.zip
          unzip -o -q /tmp/deportes_db.zip -d data
          if git fetch --depth=1 origin avisos; then git show FETCH_HEAD:avisos.json > avisos.json; fi

      - name: Ensayo con un partido ya jugado
        if: github.event.inputs.modo == 'ensayo'
        run: python vigilante.py --repetir E2026 26 16

      - name: Vigilar los partidos de hoy
        id: vigilar
        if: github.event_name == 'schedule' || github.event.inputs.modo == 'vigilar'
        run: |
          code=0
          python vigilante.py --log avisos.json --horas 4.4 || code=$?
          echo "seguir=1" >> "$GITHUB_OUTPUT"     # la cadena sigue siempre, también si esta tanda falla
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Guardar los avisos enviados (rama avisos, un solo commit)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.modo == 'vigilar')
        run: |
          [ -f avisos.json ] || exit 0
          tmp=$(mktemp -d)
          cp avisos.json "$tmp/"
          cd "$tmp"
          git init -q -b avisos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avisos.json
          git commit -q -m "Avisos hasta $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" avisos

      # Siempre se lanza la siguiente tanda (ver arriba), incluso si esta ha fallado.
      - name: Encadenar la siguiente tanda
        if: always() && (github.event_name == 'schedule' || github.event.inputs.modo == 'vigilar')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wait in 0 10 30 60 120; do
            sleep "$wait"
            if gh workflow run vigilante.yml --repo "${{ github.repository }}" -f modo=vigilar; then exit 0; fi
          done
          echo "cadena=rota" >> "$GITHUB_ENV"
          exit 1

      # Si algo ha ido mal, aviso por Telegram en el momento (no hay que descubrirlo mirando la web).
      - name: Avisar por Telegram si algo ha fallado
        if: failure() && (github.event_name == 'schedule' || github.event.inputs.modo == 'vigilar')
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          if [ "$cadena" = "rota" ]; then
            msg="⚠️ EL VIGILANTE NO HA PODIDO LANZAR LA SIGUIENTE TANDA. El respaldo de cada hora lo volverá a arrancar; si en una hora no llegan avisos, revisa: ${{ github.server_url }}/${{ github.repository }}/actions"
          else
            msg="⚠️ UNA TANDA DEL VIGILANTE HA FALLADO. La siguiente ya se ha lanzado. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${msg}" || true
