<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportsDB · Banco de pruebas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/*CSS*/
/* Una serie por línea de seguridad: mismo orden y color en la gráfica, las fichas y la tabla. */
:root { --c95: #2a78d6; --c90: #eb6834; --c80: #1baf7a }
@media (prefers-color-scheme: dark) { :root { --c95: #3987e5; --c90: #d95926; --c80: #199e70 } }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline }
.kpi .v { font: 700 30px/1.1 var(--display); font-variant-numeric: tabular-nums }
.kpi .l { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3) }
.kpi .s { font-size: 13px; color: var(--fg-2) }
.pos { color: var(--win) } .neg { color: var(--loss) }
.odds { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center }
.odds label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500 }
.odds input { width: 70px; font: 500 15px var(--body); padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg) }
.chart { position: relative }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart .grid line { stroke: var(--line); stroke-width: 1 }
.chart .axis text { fill: var(--fg-3); font: 12px var(--body) }
.chart .zero { stroke: var(--fg-3); stroke-width: 1 }
.chart .ser { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
.chart .lab { font: 600 13px var(--body); fill: var(--fg) }
.chart .xh { stroke: var(--fg-3); stroke-width: 1; stroke-dasharray: 3 3 }
.chart .tip { transform: none; white-space: normal; color: var(--fg); position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12); min-width: 210px; z-index: 2 }
.chart .tip .h { font-weight: 600; margin-bottom: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--fg-2) }
.ok { color: var(--win); font-weight: 600 } .ko { color: var(--loss); font-weight: 600 }
.bet { white-space: nowrap; line-height: 1.6 }
td.l.w { white-space: normal; min-width: 150px }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="nav"><a href="./">Panel</a><a href="en-vivo.html">En vivo</a><a href="jornada.html">Jornada</a><a href="funciona.html">¿Funciona?</a><a href="pruebas.html" aria-current="page">Banco de pruebas</a></div>
      <h1>Banco de pruebas: los avisos como si se hubieran apostado</h1><div class="muted small" id="status"></div></div>
  </header>
  <div id="view"></div>
</div>
<script>
(function () {
'use strict';
const D = /*DATA*/{}/*END*/;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d) => v == null || !isFinite(v) ? '–' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0, useGrouping: 'always' });
const eur = v => (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), 2) + ' €';
const sgn = v => v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : '';
const KIND = { desfase: 'Desfase', ritmo: 'Ritmo insostenible', triples: 'Triples insostenibles', total: 'Total desfasado', cuarto: 'Cuarto anormal', racha: 'Racha de cuartos' };
const COMP = { E: 'Euroliga', U: 'EuroCup', A: 'Liga Endesa' };
const LINES = [['95', 'Línea del 95 %'], ['90', 'Línea del 90 %'], ['80', 'Línea del 80 %']];
const CFG = D.bank_cfg || { stake: 500, odds: { 95: 1.175, 90: 1.275, 80: 1.4 }, min_odds: { 95: 1.05, 90: 1.11, 80: 1.25 } };
const ALL = (D.sent && D.sent.bank) || [];
const QUIET = (D.sent && D.sent.quiet) || [];       // detectados pero no enviados: se llevan aparte
const WHY = { partido: 'ya hubo otro aviso en el partido', regla: 'su regla no está entre las que se mandan' };
let odds = Object.assign({}, CFG.odds), stake = CFG.stake;
try { const o = JSON.parse(localStorage.getItem('banco-ajustes') || 'null'); if (o) { odds = Object.assign(odds, o.odds); stake = o.stake || stake; } } catch (e) { /* sin memoria del navegador */ }

const when = ts => new Date(ts).toLocaleString('es-ES', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
// La apuesta, corta: «Río Breogán hándicap +29,5», «Manresa menos de 28,5 puntos», «Menos de 218,5 puntos».
function shortBet(x, p) {
  const v = x.lines[p], m = x.mk || {}; if (v == null) return '–';
  const n = nf(v, 1), ou = m.over ? 'más' : 'menos';
  if (m.market === 'hcap') return `${m.team} hándicap ${v > 0 ? '+' : ''}${n}`;
  if (m.market === 'equipo') return `${m.team} ${ou} de ${n} puntos`;
  return `${ou[0].toUpperCase() + ou.slice(1)} de ${n} puntos entre los dos`;
}
const periodTxt = x => { const per = (x.mk || {}).period || 'el partido'; return per === 'el partido' ? 'Partido entero' : 'Solo ' + per; };
const betTxt = x => shortBet(x, '80') + ' · ' + periodTxt(x).toLowerCase();
const odd = v => nf(v, Math.round(v * 1000) % 10 ? 3 : 2);
const gain = (ok, p) => ok ? stake * (odds[p] - 1) : -stake;

function render() {
  const done = ALL.filter(x => x.res), open = ALL.filter(x => !x.res);
  if (!ALL.length) { $('#view').innerHTML = '<div class="panel"><div class="empty">Todavía no hay avisos enviados por Telegram.</div></div>'; return; }
  // Totales por línea y balance acumulado apuesta a apuesta (en el orden en que saltaron los avisos)
  const tot = {}, run = { 95: [0], 90: [0], 80: [0] };
  for (const [p] of LINES) tot[p] = { n: 0, ok: 0, bal: 0 };
  for (const x of done) for (const [p] of LINES) {
    const ok = !!x.res[p]; tot[p].n++; tot[p].ok += ok; tot[p].bal += gain(ok, p); run[p].push(tot[p].bal); }
  const promised = { 95: 95, 90: 90, 80: 80 };
  const kpis = LINES.map(([p, name]) => { const t = tot[p], pct = t.n ? 100 * t.ok / t.n : null, staked = t.n * stake;
    return `<div class="kpi"><div class="l"><span class="sw" style="background:var(--c${p})"></span>${name} · cuota ${odd(odds[p])}</div>
      <div class="v ${sgn(t.bal)}">${t.n ? eur(t.bal) : '–'}</div>
      <div class="s">${t.n ? `${t.ok} de ${t.n} ganadas (${nf(pct, 0)} %; prometido ${promised[p]} %) · rendimiento ${staked ? (t.bal >= 0 ? '+' : '−') + nf(Math.abs(100 * t.bal / staked), 1) + ' %' : '–'} sobre ${nf(staked)} € apostados` : 'sin apuestas resueltas'}</div></div>`; }).join('');

  // Cartera con tope de un importe por partido: solo el primer aviso de cada partido (en directo no se sabe si vendrán
  // más). Varios avisos del mismo partido suelen ganar o perder juntos; así se ve cuánto pesa eso.
  const seen = new Set(), firsts = ALL.filter(x => { const k = x.comp + '|' + x.home + '|' + x.away + '|' + x.ts.slice(0, 10);
    if (seen.has(k)) return false; seen.add(k); return true; }).filter(x => x.res);
  const capKpis = LINES.map(([p, name]) => { const ok = firsts.filter(x => x.res[p]).length, n = firsts.length,
      bal = firsts.reduce((s, x) => s + gain(!!x.res[p], p), 0);
    return `<div class="kpi"><div class="l"><span class="sw" style="background:var(--c${p})"></span>${name}</div>
      <div class="v ${sgn(bal)}">${n ? eur(bal) : '–'}</div><div class="s">${n ? `${ok} de ${n} partidos ganados (${nf(100 * ok / n, 0)} %)` : 'sin partidos resueltos'}</div></div>`; }).join('');

  // Por tipo de aviso
  const types = [...new Set(done.map(x => x.type))];
  const byType = types.map(k => { const xs = done.filter(x => x.type === k);
    return `<tr><td class="l">${esc(KIND[k] || k)}</td><td>${xs.length}</td>${LINES.map(([p]) => { const ok = xs.filter(x => x.res[p]).length, b = xs.reduce((s, x) => s + gain(!!x.res[p], p), 0);
      return `<td>${ok}/${xs.length}</td><td class="${sgn(b)}">${eur(b)}</td>`; }).join('')}</tr>`; }).join('');

  // Registro completo: lo más reciente arriba
  const rows = ALL.slice().reverse().map(x => {
    const bets = `<div class="muted small">${esc(periodTxt(x))}</div>` + LINES.map(([p]) => `<div class="bet"><span class="sw" style="background:var(--c${p})"></span>${esc(shortBet(x, p))}${
      x.res ? ` <b class="${x.res[p] ? 'ok' : 'ko'}">${x.res[p] ? '✓' : '✗'}</b>` : ''}</div>`).join('');
    // Lo que ofrecía la casa de Sergio cuando contestó al aviso en Telegram
    const casa = (x.casa || []).map(c => { if (c.none) return `<div class="small muted">Tu casa: no ofrecía nada parecido</div>`;
      const val = c.odds > 100 / c.p;
      return `<div class="small"><span class="${val ? 'ok' : 'ko'}">Tu casa: ${esc(c.line > 0 && x.hcap ? '+' : '')}${nf(c.line, 1)} a ${nf(c.odds, 2)} · acierta ${nf(c.p, 0)} %${c.implied ? ` (la casa cree ${nf(c.implied, 0)} %)` : ''} · ${val ? 'con valor' : 'sin valor'}</span>${
        c.hit == null ? '' : ` <b class="${c.hit ? 'ok' : 'ko'}">${c.hit ? '✓' : '✗'}</b>`}</div>`; }).join('');
    const g = x.res ? LINES.reduce((s, [p]) => s + gain(!!x.res[p], p), 0) : null;
    return `<tr><td class="l">${esc(when(x.ts))}</td><td class="l w">${esc(x.home)} – ${esc(x.away)}<div class="muted small">${esc(COMP[x.comp] || x.comp)}</div></td>
      <td class="l">${esc(KIND[x.type] || x.type)}${x.level === 'fuerte' ? ' · fuerte' : ''}<div class="muted small">${(x.type === 'cuarto' || x.type === 'racha') ? 'al acabar el minuto ' + nf(x.el) : 'minuto ' + nf(x.el)} · ${esc(x.score)}</div></td>
      <td class="l w">${bets}${casa}</td><td>${x.res ? esc(x.final || '') : '<span class="muted">pendiente</span>'}</td><td class="${g == null ? '' : sgn(g)}">${g == null ? '–' : eur(g)}</td></tr>`; }).join('');

  $('#view').innerHTML = `
  <section class="panel">
    <div class="muted">Prueba sin dinero. Cada aviso que el vigilante ha mandado por Telegram cuenta como si se hubiera apostado
      <strong>${nf(stake)} €</strong> en cada una de sus tres líneas. Sale una cartera por línea, para ver cuál de las tres habría funcionado mejor.
      Los avisos falsos por fallos de la fuente (el 0-0 del 3 de octubre) no cuentan.
      Si un aviso pasa de moderado a fuerte, cuenta una sola vez, con las líneas del primer mensaje.</div>
    <div class="odds"><label><span class="strong">Importe por apuesta:</span><input type="number" step="10" min="1" inputmode="decimal" id="stake" value="${stake}"> €</label>
      <span class="strong">Cuota supuesta:</span>${LINES.map(([p, name]) => `<label><span class="sw" style="background:var(--c${p})"></span>${name.replace('Línea del ', '')}
      <input type="number" step="0.005" min="1.01" inputmode="decimal" data-p="${p}" value="${odds[p]}"></label>`).join('')}
      <button class="seg" style="padding:6px 10px;cursor:pointer" id="reset">Volver a los valores por defecto</button></div>
    <div class="muted small">Por defecto: ${nf(CFG.stake)} € por apuesta y las cuotas aproximadas de la casa (${LINES.map(([p]) => odd(CFG.odds[p])).join(' / ')}). Lo que cambies aquí
      lo recuerda tu navegador. Como referencia, la cuota mínima para que cada línea salga a cuenta si acierta justo lo prometido es ${LINES.map(([p]) => odd(CFG.min_odds[p])).join(' / ')}.</div>
  </section>
  <div class="kpis">${kpis}</div>
  <section class="panel"><h2>Con tope de ${nf(stake)} € por partido</h2>
    <div class="kpis">${capKpis}</div>
    <div class="muted small">Una sola apuesta por partido y línea: la del primer aviso que saltó en él (en directo no se sabe si vendrán más).
      Los avisos de un mismo partido suelen ganar o perder juntos; esta cartera muestra el resultado sin ese efecto acumulado.</div></section>
  <section class="panel"><h2>Balance acumulado</h2>
    <div class="legend">${LINES.map(([p, name]) => `<span><span class="sw" style="background:var(--c${p})"></span>${name}</span>`).join('')}</div>
    ${done.length ? '<div class="chart" id="chart"></div>' : '<div class="empty">Aún no hay ninguna apuesta resuelta.</div>'}
    <div class="muted small">${done.length} apuestas resueltas${open.length ? ` y ${open.length} pendientes (se resuelven al acabar su partido o su cuarto)` : ''}. Eje horizontal: avisos en el orden en que saltaron.</div>
  </section>
  ${types.length ? `<section class="panel"><h2>Por tipo de aviso</h2><div class="scroll"><table><thead><tr><th class="l">Aviso</th><th>Apuestas</th>${LINES.map(([p]) => `<th>${p} %: ganadas</th><th>${p} %: balance</th>`).join('')}</tr></thead><tbody>${byType}</tbody></table></div></section>` : ''}
  ${casaSummary()}
  ${speedSummary()}
  <section class="panel"><h2>Registro de apuestas simuladas</h2>
    <div class="scroll"><table><thead><tr><th class="l">Cuándo</th><th class="l">Partido</th><th class="l">Aviso</th><th class="l">Apuesta</th><th>Final</th><th>Balance</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="muted small">Cada aviso son tres apuestas, una por línea: <span class="sw" style="background:var(--c95)"></span>95 % · <span class="sw" style="background:var(--c90)"></span>90 % · <span class="sw" style="background:var(--c80)"></span>80 %. ✓ ganada · ✗ perdida.
      «Final»: marcador final o, en los de cuarto, el valor del periodo apostado (puntos, o diferencia en los de hándicap). «Balance»: lo que dejan las tres juntas.</div>
  </section>
  ${quietSummary()}`;
  if (done.length) chart(run, done);
  document.querySelectorAll('.odds input').forEach(i => i.addEventListener('change', () => {
    const v = parseFloat(String(i.value).replace(',', '.')); if (v > 1) { odds[i.dataset.p] = v; save(); render(); } }));
  $('#stake').addEventListener('change', e => { const v = parseFloat(String(e.target.value).replace(',', '.')); if (v > 0) { stake = v; save(); render(); } });
  $('#reset').addEventListener('click', () => { odds = Object.assign({}, CFG.odds); stake = CFG.stake; save(); render(); });
}
// Avisos callados: el vigilante los detectó pero no los mandó (un solo aviso por partido, y solo las reglas que cumplen
// lo prometido). Se resuelven igual que los enviados y se enseñan APARTE: no entran en las carteras de arriba. Sirven
// para decidir si una regla de fuera merece volver o si el segundo aviso de un partido habría sido mejor que el primero.
function quietSummary() {
  const head = '<section class="panel"><h2>Avisos callados (detectados, no enviados)</h2>';
  if (!QUIET.length) return head + '<div class="muted">Aún no hay ninguno. Desde el 8 de octubre solo se manda un aviso por partido y solo de las reglas que cumplen lo prometido; el resto se guarda aquí, sin mezclarse con las apuestas de arriba.</div></section>';
  const done = QUIET.filter(x => x.res);
  const kpis = LINES.map(([p, name]) => { const ok = done.filter(x => x.res[p]).length, n = done.length, bal = done.reduce((s, x) => s + gain(!!x.res[p], p), 0);
    return `<div class="kpi"><div class="l"><span class="sw" style="background:var(--c${p})"></span>${name}</div>
      <div class="v ${sgn(bal)}">${n ? eur(bal) : '–'}</div><div class="s">${n ? `${ok} de ${n} ganadas (${nf(100 * ok / n, 0)} %)` : 'sin resolver aún'}</div></div>`; }).join('');
  const groups = [...new Set(QUIET.map(x => x.type + '|' + x.why))];
  const table = groups.map(g => { const [t, w] = g.split('|'), xs = done.filter(x => x.type === t && x.why === w), all = QUIET.filter(x => x.type === t && x.why === w);
    return `<tr><td class="l">${esc(KIND[t] || t)}</td><td class="l">${esc(WHY[w] || w)}</td><td>${all.length}</td>${LINES.map(([p]) => { const ok = xs.filter(x => x.res[p]).length;
      return `<td>${xs.length ? `${ok}/${xs.length}` : '–'}</td>`; }).join('')}</tr>`; }).join('');
  const reg = QUIET.slice().reverse().slice(0, 40).map(x => `<tr><td class="l">${esc(when(x.ts))}</td><td class="l w">${esc(x.home)} – ${esc(x.away)}</td>
    <td class="l">${esc(KIND[x.type] || x.type)}<div class="muted small">minuto ${nf(x.el)} · ${esc(x.score)} · ${esc(WHY[x.why] || x.why)}</div></td>
    <td class="l w"><div class="muted small">${esc(periodTxt(x))}</div>${LINES.map(([p]) => `<div class="bet"><span class="sw" style="background:var(--c${p})"></span>${esc(shortBet(x, p))}${
      x.res ? ` <b class="${x.res[p] ? 'ok' : 'ko'}">${x.res[p] ? '✓' : '✗'}</b>` : ''}</div>`).join('')}</td>
    <td>${x.res ? esc(x.final || '') : '<span class="muted">pendiente</span>'}</td></tr>`).join('');
  return head + `<div class="muted">Detectados pero NO enviados por Telegram. No cuentan en las carteras de arriba: aquí se ve, con las mismas cuotas, cómo habrían ido.
      Sirve para decidir si alguna regla de fuera merece volver o si el segundo aviso de un partido habría sido mejor que el primero.</div>
    <div class="kpis">${kpis}</div>
    <div class="scroll"><table><thead><tr><th class="l">Aviso</th><th class="l">Por qué se calló</th><th>Detectados</th>${LINES.map(([p]) => `<th>${p} %: ganadas</th>`).join('')}</tr></thead><tbody>${table}</tbody></table></div>
    <h3>Últimos callados</h3><div class="scroll"><table><thead><tr><th class="l">Cuándo</th><th class="l">Partido</th><th class="l">Aviso</th><th class="l">Apuesta</th><th>Final</th></tr></thead><tbody>${reg}</tbody></table></div></section>`;
}
// Lo que ofrece de verdad la casa de Sergio, anotado con los botones de Telegram («No aparece» → línea y cuota que ve).
// Sirve para dos cosas: saber dónde pone la casa sus líneas frente a las nuestras y si alguna de ellas se le puede ganar.
function casaSummary() {
  const rated = ALL.filter(x => (x.casa || []).length);
  if (!rated.length) return `<section class="panel"><h2>Tu casa de apuestas</h2><div class="muted">Aún no has valorado ningún aviso. Cuando te llegue uno por Telegram, toca la línea que ofrece tu casa (o «No aparece» y elige la que ves) y su cuota: aquí verás dónde pone la casa sus líneas, qué cree ella que pasará y dónde se le puede ganar.</div></section>`;
  const offersOf = x => x.casa.filter(c => c.line != null && c.odds);
  const ours = rated.filter(x => offersOf(x).some(c => c.p >= 79.5)).length;
  const offers = rated.flatMap(x => offersOf(x).map(c => Object.assign({ type: x.type }, c)));
  const val = offers.filter(c => c.ev > 0).length;
  // Banco real: en cada aviso, la oferta de tu casa con más valor (si la hay), una sola apuesta por aviso
  const picks = rated.map(x => { const v = offersOf(x).filter(c => c.ev > 0).sort((a, b) => b.ev - a.ev)[0]; return v ? Object.assign({ type: x.type }, v) : null; }).filter(Boolean);
  const settled = picks.filter(c => c.hit != null), won = settled.filter(c => c.hit).length;
  const bal = settled.reduce((s, c) => s + (c.hit ? stake * (c.odds - 1) : -stake), 0);
  const kinds = [...new Set(offers.map(c => c.type))];
  const avg = (xs, f) => xs.length ? xs.reduce((s, c) => s + f(c), 0) / xs.length : null;
  const byType = kinds.map(k => { const xs = offers.filter(c => c.type === k), ps = picks.filter(c => c.type === k && c.hit != null);
    const b = ps.reduce((s, c) => s + (c.hit ? stake * (c.odds - 1) : -stake), 0), edge = avg(xs, c => c.p - c.implied);
    return `<tr><td class="l">${esc(KIND[k] || k)}</td><td>${xs.length}</td><td>${nf(avg(xs, c => c.p), 0)} %</td><td>${nf(avg(xs, c => c.implied), 0)} %</td>
      <td class="${edge > 0 ? 'pos' : 'neg'}">${edge > 0 ? '+' : ''}${nf(edge, 1)}</td><td>${xs.filter(c => c.ev > 0).length}</td>
      <td>${ps.length ? `${ps.filter(c => c.hit).length}/${ps.length}` : '–'}</td><td class="${ps.length ? sgn(b) : ''}">${ps.length ? eur(b) : '–'}</td></tr>`; }).join('');
  return `<section class="panel"><h2>Tu casa de apuestas</h2><div class="kpis">
    <div class="kpi"><div class="l">Avisos valorados</div><div class="v">${rated.length}</div><div class="s">${offers.length} líneas anotadas</div></div>
    <div class="kpi"><div class="l">Ofrecía nuestras líneas</div><div class="v">${nf(100 * ours / rated.length, 0)} %</div><div class="s">${ours} de ${rated.length} (del 80 % en adelante)</div></div>
    <div class="kpi"><div class="l">Líneas con valor</div><div class="v ${val ? 'pos' : ''}">${offers.length ? nf(100 * val / offers.length, 0) + ' %' : '–'}</div><div class="s">${val} de ${offers.length}</div></div>
    <div class="kpi"><div class="l">Apostando solo las de valor</div><div class="v ${settled.length ? sgn(bal) : ''}">${settled.length ? eur(bal) : '–'}</div><div class="s">${settled.length ? `${won} de ${settled.length} ganadas · ${nf(stake)} € cada una` : 'sin resultados aún'}${picks.length > settled.length ? ` · ${picks.length - settled.length} pendientes` : ''}</div></div></div>
    ${kinds.length ? `<div class="scroll"><table><thead><tr><th class="l">Aviso</th><th>Líneas</th><th>Acierta</th><th>Cree la casa</th><th>Ventaja</th><th>Con valor</th><th>Ganadas</th><th>Balance</th></tr></thead><tbody>${byType}</tbody></table></div>` : ''}
    <div class="muted small">Sale de lo que anotas con los botones de Telegram. «Acierta»: nuestro cálculo para esa línea. «Cree la casa» = 100 / cuota (lleva dentro su margen, así que la casa siempre parece
      un poco más pesimista de lo que es). «Ventaja» (puntos de %) positiva: nuestro cálculo da más probable ganar que la casa, y es donde se le puede ganar a largo plazo.
      «Apostando solo las de valor»: una apuesta por aviso, la línea de tu casa con más valor, con el importe de arriba. Las líneas por debajo del 80 % se
      pierden a menudo: hacen falta muchas apuestas para que se note si de verdad se le gana a la casa.</div></section>`;
}
// Rapidez: cuánto tarda el aviso desde que el vigilante lee el dato y cuánto tarda Sergio en tocar el primer botón.
// No mide el retraso de la propia fuente frente a la tele (eso solo se puede comparar a ojo).
function speedSummary() {
  const med = xs => { if (!xs.length) return null; const s = xs.slice().sort((a, b) => a - b), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const read = ALL.filter(x => x.lat).map(x => x.lat.read), poll = ALL.filter(x => x.lat && x.lat.poll).map(x => x.lat.poll);
  const react = ALL.filter(x => x.react != null).map(x => x.react);
  if (!read.length && !react.length) return '';
  const k = (l, v, s) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v == null ? '–' : nf(v, 0) + ' s'}</div><div class="s">${s}</div></div>`;
  return `<section class="panel"><h2>Rapidez de los avisos</h2><div class="kpis">
    ${k('Lectura → aviso', med(read), `mediana de ${read.length} avisos`)}
    ${k('Cada cuánto se lee', med(poll), 'un cambio tarda de media la mitad en verse')}
    ${k('Aviso → tu primer toque', med(react), `mediana de ${react.length} avisos valorados`)}</div>
    <div class="muted small">Si la casa ya ha movido la línea cuando llega el aviso, llegamos tarde: compáralo alguna vez con la tele o la app de la casa.</div></section>`;
}
function save() { try { localStorage.setItem('banco-ajustes', JSON.stringify({ odds, stake })); } catch (e) { /* sin memoria del navegador */ } }

// Gráfica de líneas: balance acumulado de cada cartera tras cada apuesta. Etiqueta directa al final de cada línea y cruz con detalle al pasar el ratón.
function chart(run, done) {
  const box = $('#chart'), W = Math.max(320, box.clientWidth), H = 300, m = { l: 56, r: 150, t: 12, b: 28 };
  const n = done.length, all = [].concat(run[95], run[90], run[80]);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi - lo < 10) { hi += 5; lo -= 5; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = i => m.l + (n ? i / n : 0) * (W - m.l - m.r), y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const step = niceStep((hi - lo) / 5), ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const xt = []; const xs = Math.max(1, Math.ceil(n / 8)); for (let i = 0; i <= n; i += xs) xt.push(i);
  const path = p => run[p].map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('');
  // Etiquetas finales sin solaparse: se ordenan por altura y se separan al menos 16 px
  const ends = ['95', '90', '80'].map(p => ({ p, v: run[p][n], yy: y(run[p][n]) })).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 16) ends[i].yy = ends[i - 1].yy + 16;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance acumulado de cada línea tras cada apuesta simulada">
    <g class="grid">${ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"></line>`).join('')}</g>
    <g class="axis">${ticks.map(v => `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${(v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v))} €</text>`).join('')}
      ${xt.map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i}</text>`).join('')}</g>
    <line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"></line>
    ${['95', '90', '80'].map(p => `<path class="ser" d="${path(p)}" style="stroke:var(--c${p})"></path>`).join('')}
    ${['95', '90', '80'].map(p => `<circle cx="${x(n)}" cy="${y(run[p][n])}" r="4" style="fill:var(--c${p});stroke:var(--surface);stroke-width:2"></circle>`).join('')}
    ${ends.map(e => `<text class="lab" x="${x(n) + 10}" y="${e.yy + 4}">${e.p} %: ${eur(e.v)}</text>`).join('')}
    <line class="xh" id="xh" y1="${m.t}" y2="${H - m.b}" x1="-10" x2="-10"></line>
    <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"></rect></svg><div class="tip" id="tip" hidden></div>`;
  const hit = $('#hit'), tip = $('#tip'), xh = $('#xh');
  const move = ev => {
    const r = box.querySelector('svg').getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(1, Math.min(n, Math.round((px - m.l) / (W - m.l - m.r) * n))), b = done[i - 1];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i));
    tip.innerHTML = `<div class="h">Apuesta ${i} · ${esc(when(b.ts))}</div><div>${esc(b.home)} – ${esc(b.away)}</div><div class="muted">${esc(KIND[b.type] || b.type)} · ${esc(betTxt(b))}</div>
      ${['95', '90', '80'].map(p => `<div><span class="sw" style="background:var(--c${p})"></span>${p} %: ${b.res[p] ? 'ganada' : 'perdida'} · acumulado <strong>${eur(run[p][i])}</strong></div>`).join('')}`;
    tip.hidden = false;
    const left = x(i) * r.width / W; tip.style.left = Math.min(Math.max(0, left + 12), r.width - tip.offsetWidth) + 'px'; tip.style.top = '8px';
  };
  hit.addEventListener('mousemove', move); hit.addEventListener('mouseleave', () => { tip.hidden = true; xh.setAttribute('x1', -10); xh.setAttribute('x2', -10); });
  hit.addEventListener('touchstart', e => move(e.touches[0]), { passive: true });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

$('#status').textContent = 'Actualizado ' + new Date(D.updated).toLocaleString('es-ES') + ' · se rehace cada día y con cada versión nueva de la web.';
render();
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
})();
</script>
