<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportsDB · Banco de pruebas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/*CSS*/
/* Una serie por línea de seguridad: mismo orden y color en la gráfica, las fichas y la tabla. */
:root { --c95: #2a78d6; --c90: #eb6834; --c80: #1baf7a; --c85: #1baf7a; --c82: #8b4fd8 }
@media (prefers-color-scheme: dark) { :root { --c95: #3987e5; --c90: #d95926; --c80: #199e70; --c85: #199e70; --c82: #a175ea } }
:root { --ccasa: var(--fg) }
.amt { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 4px; display: inline-block; min-width: 4.6em }
.exp { border: 2px dashed var(--c82) }
/* v2 (desde el 9-11-2026): avisos con línea rebajada en directo, resaltados en todas las tablas */
tr.v2 td { background: color-mix(in srgb, var(--c82) 12%, transparent) }
tr.v2 td:first-child { box-shadow: inset 4px 0 0 var(--c82) }
.v2tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: var(--c82); color: #fff; font: 600 11px/18px var(--body); vertical-align: 1px }
.exp h2 { color: var(--c82) }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline }
.kpi .v { font: 700 30px/1.1 var(--display); font-variant-numeric: tabular-nums }
.kpi .l { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3) }
.kpi .s { font-size: 13px; color: var(--fg-2) }
.pos { color: var(--win) } .neg { color: var(--loss) }
.odds { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center }
.odds label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500 }
.odds input { width: 70px; font: 500 15px var(--body); padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg) }
.chart { position: relative }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart .grid line { stroke: var(--line); stroke-width: 1 }
.chart .axis text { fill: var(--fg-3); font: 12px var(--body) }
.chart .zero { stroke: var(--fg-3); stroke-width: 1 }
.chart .ser { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
.chart .lab { font: 600 13px var(--body); fill: var(--fg) }
.chart .xh { stroke: var(--fg-3); stroke-width: 1; stroke-dasharray: 3 3 }
.chart .tip { transform: none; white-space: normal; color: var(--fg); position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12); min-width: 210px; z-index: 2 }
.chart .tip .h { font-weight: 600; margin-bottom: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--fg-2) }
.ok { color: var(--win); font-weight: 600 } .ko { color: var(--loss); font-weight: 600 }
.bet { white-space: nowrap; line-height: 1.6 }
td.l.w { white-space: normal; min-width: 150px }
td.rbw { white-space: normal; min-width: 130px; vertical-align: top }
#rbTable td:last-child { vertical-align: top; white-space: nowrap }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="nav"><a href="./">Panel</a><a href="en-vivo.html">En vivo</a><a href="jornada.html">Jornada</a><a href="funciona.html">¿Funciona?</a><a href="pruebas.html" aria-current="page">Banco de pruebas</a><a href="futbol.html">Fútbol</a></div>
      <h1>Banco de pruebas: los avisos como si se hubieran apostado</h1><div class="muted small" id="status"></div></div>
  </header>
  <div id="view"></div>
</div>
<script>
(function () {
'use strict';
const D = /*DATA*/{}/*END*/;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d) => v == null || !isFinite(v) ? '–' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0, useGrouping: 'always' });
const eur = v => (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), 2) + ' €';
const sgn = v => v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : '';
const KIND = { desfase: 'Desfase', ritmo: 'Ritmo insostenible', triples: 'Triples insostenibles', total: 'Total desfasado', cuarto: 'Cuarto anormal', racha: 'Racha de cuartos' };
const COMP = { E: 'Euroliga', U: 'EuroCup', A: 'Liga Endesa' };
// Las cuatro líneas del banco, siempre en este orden y con su color: 95 azul, 90 naranja, 85 verde, rebajada morado
const LINES = [['95', 'Línea del 95 %'], ['90', 'Línea del 90 %'], ['85', 'Línea del 85 %'], ['82', '🧪 Línea rebajada']];
const LN = p => p === '82' ? 'Rebajada' : p + ' %';
const CFG = D.bank_cfg || { stake: 500, odds: { 95: 1.12, 90: 1.17, 85: 1.24, 82: 1.29 }, min_odds: { 95: 1.05, 90: 1.11, 85: 1.18, 82: 1.22 } };
if (CFG.odds[82] == null) CFG.odds[82] = 1.29;
if (CFG.odds[85] == null) CFG.odds[85] = 1.24;
const ALL = (D.sent && D.sent.bank) || [];
const QUIET = (D.sent && D.sent.quiet) || [];       // detectados pero no enviados: se llevan aparte
const WHY = { partido: 'ya hubo otro aviso en el partido', regla: 'su regla no está entre las que se mandan' };
let odds = Object.assign({}, CFG.odds), stake = CFG.stake;
try { const o = JSON.parse(localStorage.getItem('banco-ajustes-2') || 'null'); if (o) { odds = Object.assign(odds, o.odds); stake = o.stake || stake; } } catch (e) { /* sin memoria del navegador */ }

const isV2 = x => !!(x.rb && x.rb.live);
const v2tr = x => isV2(x) ? '<tr class="v2">' : '<tr>';
const v2tag = x => (x.num ? `<div class="small strong">N.º ${x.num} · ${isV2(x) ? 'v2' : 'v1'}</div>` : '')
  + (isV2(x) ? '<span class="v2tag" title="Aviso de la v2: con línea rebajada (desde el 9-11-2026)">v2</span>' : '');
const when = ts => new Date(ts).toLocaleString('es-ES', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
// La apuesta, corta: «Río Breogán hándicap +29,5», «Manresa menos de 28,5 puntos», «Menos de 218,5 puntos».
function shortBet(x, p) {
  const v = x.lines[p], m = x.mk || {}; if (v == null) return '–';
  const n = nf(v, 1), ou = m.over ? 'más' : 'menos';
  if (m.market === 'hcap') return `${m.team} hándicap ${v > 0 ? '+' : ''}${n}`;
  if (m.market === 'equipo') return `${m.team} ${ou} de ${n} puntos`;
  return `${ou[0].toUpperCase() + ou.slice(1)} de ${n} puntos entre los dos`;
}
const periodTxt = x => { const per = (x.mk || {}).period || 'el partido'; return per === 'el partido' ? 'Partido entero' : 'Solo ' + per; };
const betTxt = x => shortBet(x, '85') + ' · ' + periodTxt(x).toLowerCase();
const odd = v => nf(v, Math.round(v * 1000) % 10 ? 3 : 2);
const gain = (ok, p) => ok ? stake * (odds[p] - 1) : -stake;
const has = (x, p) => !!x.res && x.res[p] != null;     // la línea existe y está resuelta (si no, no se apuesta)
const gx = (x, p) => has(x, p) ? gain(x.res[p], p) : 0;
// «Tu casa» (13-11-2026, Sergio): la línea que anotó de su casa a su cuota real, una apuesta por aviso (si anotó varias,
// la de más valor). Sin línea anotada no hay apuesta. Es la quinta serie de las gráficas, en negro.
const casaGain = c => c.hit == null ? null : c.hit ? stake * (c.odds - 1) : -stake;
const casaPick = x => (x.casa || []).filter(c => c.line != null && c.odds && !c.none).sort((a, b) => (b.ev || 0) - (a.ev || 0))[0] || null;
const SER5 = ['95', '90', '85', '82', 'casa'];
const NM = p => p === 'casa' ? 'Tu casa' : LN(p);
const COL = p => p === 'casa' ? 'var(--ccasa)' : `var(--c${p})`;
// Balance acumulado de un grupo de avisos resueltos, para las cinco series
function runOf(xs) {
  const run = {}, acc = {}, n = {}, ok = {}; for (const p of SER5) { run[p] = [0]; acc[p] = 0; n[p] = 0; ok[p] = 0; }
  for (const x of xs) { for (const [p] of LINES) { if (has(x, p)) { acc[p] += gain(!!x.res[p], p); n[p]++; ok[p] += !!x.res[p]; } run[p].push(acc[p]); }
    const c = casaPick(x), g = c ? casaGain(c) : null; if (g != null) { acc.casa += g; n.casa++; ok.casa += !!c.hit; } run.casa.push(acc.casa); }
  return { run, n, ok };
}

function render() {
  const done = ALL.filter(x => x.res), open = ALL.filter(x => !x.res);
  const d1 = done.filter(x => !isV2(x)), d2 = done.filter(isV2);
  if (!ALL.length) { $('#view').innerHTML = '<div class="panel"><div class="empty">Todavía no hay avisos enviados por Telegram.</div></div>'; return; }
  // Totales por línea y balance acumulado apuesta a apuesta (en el orden en que saltaron los avisos)
  const tot = {}, run = { 95: [0], 90: [0], 85: [0], 82: [0] };
  for (const [p] of LINES) tot[p] = { n: 0, ok: 0, bal: 0 };
  for (const x of done) for (const [p] of LINES) {
    if (has(x, p)) { const ok = !!x.res[p]; tot[p].n++; tot[p].ok += ok; tot[p].bal += gain(ok, p); } run[p].push(tot[p].bal); }
  const promised = { 95: '95', 90: '90', 85: '85', 82: '≈82' };
  const kpis = LINES.map(([p, name]) => { const t = tot[p], pct = t.n ? 100 * t.ok / t.n : null, staked = t.n * stake;
    return `<div class="kpi"><div class="l"><span class="sw" style="background:var(--c${p})"></span>${name} · cuota ${odd(odds[p])}</div>
      <div class="v ${sgn(t.bal)}">${t.n ? eur(t.bal) : '–'}</div>
      <div class="s">${t.n ? `${t.ok} de ${t.n} ganadas (${nf(pct, 0)} %; prometido ${promised[p]} %) · rendimiento ${staked ? (t.bal >= 0 ? '+' : '−') + nf(Math.abs(100 * t.bal / staked), 1) + ' %' : '–'} sobre ${nf(staked)} € apostados` : 'sin apuestas resueltas'}</div></div>`; }).join('');

  // Cartera con tope de un importe por partido: solo el primer aviso de cada partido (en directo no se sabe si vendrán
  // más). Varios avisos del mismo partido suelen ganar o perder juntos; así se ve cuánto pesa eso.
  const seen = new Set(), firsts = ALL.filter(x => { const k = x.comp + '|' + x.home + '|' + x.away + '|' + x.ts.slice(0, 10);
    if (seen.has(k)) return false; seen.add(k); return true; }).filter(x => x.res);
  const capKpis = LINES.map(([p, name]) => { const fx = firsts.filter(x => has(x, p)), ok = fx.filter(x => x.res[p]).length, n = fx.length,
      bal = fx.reduce((s, x) => s + gx(x, p), 0);
    return `<div class="kpi"><div class="l"><span class="sw" style="background:var(--c${p})"></span>${name}</div>
      <div class="v ${sgn(bal)}">${n ? eur(bal) : '–'}</div><div class="s">${n ? `${ok} de ${n} partidos ganados (${nf(100 * ok / n, 0)} %)` : 'sin partidos resueltos'}</div></div>`; }).join('');

  // Por tipo de aviso
  const types = [...new Set(done.map(x => x.type))];
  const byType = types.map(k => { const xs = done.filter(x => x.type === k);
    return `<tr><td class="l">${esc(KIND[k] || k)}</td><td>${xs.length}</td>${LINES.map(([p]) => { const ys = xs.filter(x => has(x, p)), ok = ys.filter(x => x.res[p]).length, b = ys.reduce((s, x) => s + gx(x, p), 0);
      return `<td style="color:var(--c${p})">${ok}/${ys.length}</td><td class="${sgn(b)}">${eur(b)}</td>`; }).join('')}</tr>`; }).join('');

  // Registro completo: lo más reciente arriba
  const rows = ALL.slice().reverse().map(x => {
    const bets = `<div class="muted small">${esc(periodTxt(x))}</div>` + LINES.map(([p]) => `<div class="bet" style="color:var(--c${p})"><span class="sw" style="background:var(--c${p})"></span>${
      has(x, p) ? `<b class="${x.res[p] ? 'ok' : 'ko'}">${x.res[p] ? '✓' : '✗'}</b><span class="amt ${sgn(gx(x, p))}">${eur(gx(x, p))}</span> · ` : ''}${esc(shortBet(x, p))}</div>`).join('');
    // Lo que ofrecía la casa de Sergio cuando contestó al aviso en Telegram
    const casa = (x.casa || []).map(c => { if (c.none) return `<div class="small muted">Tu casa: no ofrecía nada parecido</div>`;
      const val = c.odds > 100 / c.p;
      return `<div class="small">${c.hit == null ? '' : `<b class="${c.hit ? 'ok' : 'ko'}">${c.hit ? '✓' : '✗'}</b><span class="amt ${sgn(casaGain(c))}">${eur(casaGain(c))}</span> · `}<span class="${val ? 'ok' : 'ko'}">Tu casa: ${esc(c.line > 0 && x.hcap ? '+' : '')}${nf(c.line, 1)} a ${odd(c.odds)} · acierta ${nf(c.p, 0)} %${c.implied ? ` (la casa cree ${nf(c.implied, 0)} %)` : ''} · ${val ? 'con valor' : 'sin valor'}</span></div>`; }).join('');
    return `${v2tr(x)}<td class="l">${esc(when(x.ts))}${v2tag(x)}</td><td class="l w">${esc(x.home)} – ${esc(x.away)}<div class="muted small">${esc(COMP[x.comp] || x.comp)}</div></td>
      <td class="l">${esc(KIND[x.type] || x.type)}${x.level === 'fuerte' ? ' · fuerte' : ''}<div class="muted small">${(x.type === 'cuarto' || x.type === 'racha') ? 'al acabar el minuto ' + nf(x.el) : 'minuto ' + nf(x.el)} · ${esc(x.score)}</div></td>
      <td class="l w">${bets}${casa}</td><td>${x.res ? esc(x.final || '') : '<span class="muted">pendiente</span>'}</td></tr>`; }).join('');

  $('#view').innerHTML = `
  <section class="panel">
    <div class="muted">Prueba sin dinero. Cada aviso que el vigilante ha mandado por Telegram cuenta como si se hubiera apostado
      <strong>${nf(stake)} €</strong> en cada una de sus cuatro líneas (95, 90, 85 y rebajada). Sale una cartera por línea, para ver cuál habría funcionado mejor.
      Los avisos falsos por fallos de la fuente (el 0-0 del 3 de octubre) no cuentan.
      Si un aviso pasa de moderado a fuerte, cuenta una sola vez, con las líneas del primer mensaje.</div>
    <div class="small" style="margin-top:6px"><span class="v2tag" style="margin-left:0">v2</span> Las filas con fondo morado son avisos de la <strong>v2</strong> (desde el 9-11-2026): ya sin los tipos que acertaban menos del 85 % y con la línea rebajada (morada).</div>
    <div class="odds"><label><span class="strong">Importe por apuesta:</span><input type="number" step="10" min="1" inputmode="decimal" id="stake" value="${stake}"> €</label>
      <span class="strong">Cuota supuesta:</span>${LINES.map(([p, name]) => `<label><span class="sw" style="background:var(--c${p})"></span>${LN(p)}
      <input type="number" step="0.005" min="1.01" inputmode="decimal" data-p="${p}" value="${odds[p]}"></label>`).join('')}
      <button class="seg" style="padding:6px 10px;cursor:pointer" id="reset">Volver a los valores por defecto</button></div>
    <div class="muted small">Por defecto: ${nf(CFG.stake)} € por apuesta y las cuotas aproximadas de la casa (${LINES.map(([p]) => odd(CFG.odds[p])).join(' / ')}). Lo que cambies aquí
      lo recuerda tu navegador. Como referencia, la cuota mínima para que cada línea salga a cuenta si acierta justo lo prometido es ${LINES.map(([p]) => odd(CFG.min_odds[p])).join(' / ')}.</div>
  </section>
  <div class="kpis">${kpis}</div>
  ${rebajaSummary()}
  <section class="panel"><h2>Con tope de ${nf(stake)} € por partido</h2>
    <div class="kpis">${capKpis}</div>
    <div class="muted small">Una sola apuesta por partido y línea: la del primer aviso que saltó en él (en directo no se sabe si vendrán más).
      Los avisos de un mismo partido suelen ganar o perder juntos; esta cartera muestra el resultado sin ese efecto acumulado.</div></section>
  <section class="panel"><h2>Balance acumulado: v1 y v2 por separado</h2>
    <div class="legend">${SER5.map(p => `<span><span class="sw" style="background:${COL(p)}"></span>${p === 'casa' ? 'Tu casa: la línea que anotaste, a su cuota real' : LINES.find(l => l[0] === p)[1] + ' · cuota supuesta ' + odd(odds[p])}</span>`).join('')}</div>
    ${[['v1', 'v1 · avisos hasta el 9-11-2026', d1], ['v2', 'v2 · avisos afinados, desde el 9-11-2026', d2]].map(([k, t, xs]) => { const r = runOf(xs);
      return `<h3 style="margin:18px 0 6px">${t}</h3>${xs.length ? `<div class="chart" id="chart-${k}"></div>
      <div class="scroll"><table><thead><tr><th class="l">Cartera</th><th>Apuestas</th><th>Ganadas</th><th>Balance</th></tr></thead><tbody>${SER5.map(p => `<tr><td class="l" style="color:${COL(p)}"><span class="sw" style="background:${COL(p)}"></span>${NM(p)}</td><td>${r.n[p]}</td><td>${r.n[p] ? `${r.ok[p]} (${nf(100 * r.ok[p] / r.n[p], 0)} %)` : '–'}</td><td class="${r.n[p] ? sgn(r.run[p][xs.length]) : ''}">${r.n[p] ? eur(r.run[p][xs.length]) : '–'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Aún no hay ninguna apuesta resuelta.</div>'}`; }).join('')}
    <div class="muted small">${done.length} avisos resueltos${open.length ? ` y ${open.length} pendientes` : ''}. Eje horizontal: avisos en el orden en que saltaron. Las cuatro líneas de color usan la cuota supuesta de arriba.
      La línea negra «Tu casa» es la única con cuotas reales: en cada aviso, la línea que anotaste de tu casa (si anotaste varias, la de más valor), con ${nf(stake)} €; en los avisos en que no anotaste ninguna no apuesta y la línea sigue plana.
      Si la negra baja mientras las de color suben, lo que ofrece la casa está más ajustado de lo que nuestras líneas aguantan.</div>
  </section>
  ${types.length ? `<section class="panel"><h2>Por tipo de aviso</h2><div class="scroll"><table><thead><tr><th class="l">Aviso</th><th>Apuestas</th>${LINES.map(([p]) => `<th style="color:var(--c${p})">${LN(p)}: ganadas</th><th style="color:var(--c${p})">balance</th>`).join('')}</tr></thead><tbody>${byType}</tbody></table></div></section>` : ''}
  ${casaSummary()}
  ${speedSummary()}
  <section class="panel"><h2>Registro de apuestas simuladas</h2>
    <div class="scroll"><table><thead><tr><th class="l">Cuándo</th><th class="l">Partido</th><th class="l">Aviso</th><th class="l">Apuesta y lo que deja cada línea</th><th>Final</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="muted small">Cada aviso son cuatro apuestas, una por línea: <span class="sw" style="background:var(--c95)"></span>95 % · <span class="sw" style="background:var(--c90)"></span>90 % · <span class="sw" style="background:var(--c85)"></span>85 % (antes 80 %, cambiada el 10-11-2026) · <span class="sw" style="background:var(--c82)"></span>rebajada. La del 85 y la rebajada se calculan también sobre los avisos anteriores. ✓ ganada · ✗ perdida.
      «Final»: marcador final o, en los de cuarto, el valor del periodo apostado (puntos, o diferencia en los de hándicap). Al lado de cada línea, lo que habría ganado o perdido ella sola con ${nf(stake)} € a su cuota supuesta; en «Tu casa», con la cuota real que anotaste.</div>
  </section>
  ${quietSummary()}`;
  if (d1.length) chart('#chart-v1', runOf(d1).run, d1);
  if (d2.length) chart('#chart-v2', runOf(d2).run, d2);
  document.querySelectorAll('#rbF select').forEach(sel => { sel.value = rbF[sel.dataset.k] || '';
    if (sel.value !== (rbF[sel.dataset.k] || '')) sel.selectedIndex = 0;
    sel.addEventListener('change', () => { rbF[sel.dataset.k] = sel.value; rbMax = 30; try { localStorage.setItem('banco-rebajada', JSON.stringify(rbF)); } catch (e) { /* */ } rbTable(); }); });
  rbTable();
  document.querySelectorAll('.odds input').forEach(i => i.addEventListener('change', () => {
    const v = parseFloat(String(i.value).replace(',', '.')); if (v > 1) { odds[i.dataset.p] = v; save(); render(); } }));
  $('#stake').addEventListener('change', e => { const v = parseFloat(String(e.target.value).replace(',', '.')); if (v > 0) { stake = v; save(); render(); } });
  $('#reset').addEventListener('click', () => { odds = Object.assign({}, CFG.odds); stake = CFG.stake; save(); render(); });
}
// Experimento de la línea rebajada (desde el 9-11-2026, idea de Sergio): la línea del 95 casi nunca aparece en la casa.
// Cada aviso trae una 🔵 línea más ajustada (punto del 82 % de la campana, al menos 1 punto por debajo de la del 90).
// Aparte: no entra en las carteras de arriba. «En directo» = avisos que la llevaron de verdad; «Simulada» = la misma
// cuenta hecha ahora sobre los avisos anteriores cuya regla se sigue mandando hoy.
function rebajaSummary() {
  const withRb = ALL.filter(x => x.rb), live = withRb.filter(x => x.rb.live), sim = withRb.filter(x => !x.rb.live && x.rb.now);
  const card = (xs, title, note) => { const d = xs.filter(x => x.rb.hit != null), ok = d.filter(x => x.rb.hit).length,
      bal = d.reduce((s, x) => s + (x.rb.hit ? stake * (odds[82] - 1) : -stake), 0),

  const hit = box.querySelector('.hit'), tip = box.querySelector('.tip'), xh = box.querySelector('.xh');
  const move = ev => {
    const r = box.querySelector('svg').getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(1, Math.min(n, Math.round((px - m.l) / (W - m.l - m.r) * n))), b = done[i - 1];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i));
    tip.innerHTML = `<div class="h">Apuesta ${i} · ${esc(when(b.ts))}</div><div>${esc(b.home)} – ${esc(b.away)}</div><div class="muted">${esc(KIND[b.type] || b.type)} · ${esc(betTxt(b))}</div>
      ${SER.map(p => { const c = p === 'casa' ? casaPick(b) : null, ok = p === 'casa' ? (c ? c.hit : null) : has(b, p) ? b.res[p] : null;
        return `<div><span class="sw" style="background:${COL(p)}"></span>${nm(p)}${c ? ` (${nf(c.line, 1)} a ${odd(c.odds)})` : ''}: ${ok == null ? 'sin línea' : ok ? 'ganada' : 'perdida'} · acumulado <strong>${eur(run[p][i])}</strong></div>`; }).join('')}`;
    tip.hidden = false;
    const left = x(i) * r.width / W; tip.style.left = Math.min(Math.max(0, left + 12), r.width - tip.offsetWidth) + 'px'; tip.style.top = '8px';
  };
  hit.addEventListener('mousemove', move); hit.addEventListener('mouseleave', () => { tip.hidden = true; xh.setAttribute('x1', -10); xh.setAttribute('x2', -10); });
  hit.addEventListener('touchstart', e => move(e.touches[0]), { passive: true });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

$('#status').textContent = 'Actualizado ' + new Date(D.updated).toLocaleString('es-ES') + ' · se rehace cada día y con cada versión nueva de la web.';
render();
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
})();
